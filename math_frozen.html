<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#a5d8f3">
<title>冰雪奇缘心算王国 · Frozen Math Kingdom</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg-grad: linear-gradient(180deg, #e0f4ff 0%, #c5e8ff 50%, #a5d8f3 100%);
  --bg-card: rgba(255, 255, 255, 0.85);
  --bg-card-solid: #ffffff;
  --text-primary: #1a3a5c;
  --text-secondary: #4a6fa5;
  --text-light: #7a9ec5;
  --accent-blue: #4fc3f7;
  --accent-purple: #7c4dff;
  --accent-gold: #ffc44d;
  --accent-pink: #ff80ab;
  --accent-green: #66bb6a;
  --accent-red: #ef5350;
  --shadow: 0 6px 18px rgba(76,195,247,0.25);
  --shadow-strong: 0 10px 28px rgba(76,195,247,0.35);
  --border-card: 2px solid rgba(255,255,255,0.7);
  --snow-color: rgba(255, 255, 255, 0.85);
  --divider: rgba(0,0,0,0.06);
}

[data-theme="dark"] {
  --bg-grad: linear-gradient(180deg, #0a1929 0%, #142847 50%, #1e3a5f 100%);
  --bg-card: rgba(30, 50, 80, 0.7);
  --bg-card-solid: #1e3050;
  --text-primary: #eaf4ff;
  --text-secondary: #b8d4f0;
  --text-light: #88a8c8;
  --accent-blue: #60a5fa;
  --accent-purple: #a78bfa;
  --accent-gold: #fcd34d;
  --accent-pink: #f472b6;
  --accent-green: #4ade80;
  --accent-red: #f87171;
  --shadow: 0 6px 18px rgba(0,0,0,0.4);
  --shadow-strong: 0 10px 28px rgba(0,0,0,0.5);
  --border-card: 2px solid rgba(255,255,255,0.1);
  --snow-color: rgba(200, 220, 255, 0.7);
  --divider: rgba(255,255,255,0.08);
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.snowflakes {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  overflow: hidden;
}
.snowflake {
  position: absolute; top: -20px;
  color: var(--snow-color);
  user-select: none;
  animation: fall linear infinite;
}
@keyframes fall {
  0% { transform: translateY(-20px) rotate(0deg); }
  100% { transform: translateY(105vh) rotate(360deg); }
}

[data-theme="dark"] .stars {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
[data-theme="dark"] .star {
  position: absolute;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

.app {
  position: relative; z-index: 1;
  max-width: 600px;
  margin: 0 auto;
  padding: 12px 16px 28px;
  min-height: 100vh;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  gap: 8px;
}
.top-bar-right { display: flex; gap: 8px; }

.icon-btn {
  background: var(--bg-card);
  border: var(--border-card);
  border-radius: 50%;
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text-primary);
}
.icon-btn:active { transform: scale(0.92); }

.lang-btn {
  background: var(--bg-card);
  border: var(--border-card);
  border-radius: 21px;
  height: 42px; padding: 0 14px;
  font-weight: bold; font-size: 13px;
  color: var(--text-primary);
  box-shadow: var(--shadow);
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.lang-btn:active { transform: scale(0.95); }

.screen {
  display: none;
  animation: slideIn 0.35s ease;
}
.screen.active { display: block; }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.title {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  margin: 8px 0 4px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.5px;
}
.subtitle {
  text-align: center;
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.section-title {
  font-size: 17px;
  font-weight: 700;
  margin: 18px 0 10px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.character-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.character-card {
  background: var(--bg-card);
  border: 3px solid transparent;
  border-radius: 18px;
  padding: 8px 4px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.25s;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.character-card:active { transform: scale(0.96); }
.character-card.selected {
  border-color: var(--accent-purple);
  background: linear-gradient(135deg, rgba(124,77,255,0.15), rgba(79,195,247,0.15));
  box-shadow: var(--shadow-strong);
  transform: translateY(-3px);
}
.character-card svg {
  width: 80px; height: 80px;
  display: block; margin: 0 auto;
}
.character-name {
  margin-top: 4px;
  font-weight: 700;
  font-size: 13px;
  color: var(--text-primary);
}

.mode-btn {
  display: block;
  width: 100%;
  background: var(--bg-card);
  border: var(--border-card);
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  text-align: left;
  box-shadow: var(--shadow);
  color: var(--text-primary);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.mode-btn:active { transform: scale(0.98); }
.mode-row {
  display: flex; align-items: center; gap: 14px;
}
.mode-icon {
  font-size: 32px; flex-shrink: 0;
  width: 50px; height: 50px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
}
.mode-text { flex: 1; }
.mode-name { font-weight: 700; font-size: 17px; margin-bottom: 2px; }
.mode-desc { font-size: 12px; color: var(--text-secondary); }

.level-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.level-cell {
  aspect-ratio: 1;
  background: var(--bg-card);
  border: var(--border-card);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  position: relative;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.level-cell:active:not(.locked) { transform: scale(0.94); }
.level-cell.locked { opacity: 0.45; cursor: not-allowed; }
.level-cell.unlocked {
  background: linear-gradient(135deg, rgba(79,195,247,0.2), rgba(124,77,255,0.15));
}
.level-num {
  font-size: 22px; font-weight: 800;
  color: var(--accent-purple);
  line-height: 1;
}
.level-stars {
  font-size: 9px; margin-top: 3px;
  color: var(--accent-gold);
  letter-spacing: 1px;
  height: 12px;
}
.level-lock {
  position: absolute; top: 4px; right: 6px;
  font-size: 11px; opacity: 0.7;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  color: white;
  border: none;
  border-radius: 22px;
  padding: 15px 28px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  width: 100%;
  box-shadow: var(--shadow-strong);
  margin-top: 10px;
  letter-spacing: 0.5px;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-secondary {
  background: var(--bg-card);
  color: var(--text-primary);
  border: var(--border-card);
  border-radius: 22px;
  padding: 13px 24px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.btn-secondary:active { transform: scale(0.97); }

.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.game-header {
  display: flex;
  align-items: center;
  margin-bottom: 14px;
  gap: 8px;
  flex-wrap: wrap;
}
.player-mini { display: flex; align-items: center; gap: 6px; }
.player-mini svg { width: 38px; height: 38px; }
.player-name { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.player-level { font-size: 11px; color: var(--text-secondary); }

.stat-pill {
  background: var(--bg-card);
  border: var(--border-card);
  border-radius: 16px;
  padding: 6px 11px;
  font-weight: 700;
  font-size: 13px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 5px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text-primary);
}
.stat-pill.warn { color: var(--accent-red); animation: pulse 0.7s infinite; }
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.question-card {
  background: var(--bg-card);
  border: var(--border-card);
  border-radius: 24px;
  padding: 30px 18px;
  text-align: center;
  margin-bottom: 14px;
  box-shadow: var(--shadow-strong);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  min-height: 200px;
}
.question-card::before {
  content: "❄";
  position: absolute;
  top: -15px; right: -15px;
  font-size: 80px;
  color: var(--accent-blue);
  opacity: 0.12;
  pointer-events: none;
}
.question-text {
  font-size: 50px;
  font-weight: 800;
  color: var(--text-primary);
  margin: 12px 0;
  letter-spacing: 4px;
  line-height: 1.1;
}
.question-text .eq { color: var(--accent-purple); }
.answer-display {
  background: var(--bg-card-solid);
  border: 3px solid var(--accent-blue);
  border-radius: 18px;
  padding: 12px;
  font-size: 38px;
  font-weight: 800;
  text-align: center;
  width: 60%;
  max-width: 200px;
  min-height: 64px;
  color: var(--text-primary);
  margin: 10px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 4px;
}
.answer-display.shake { animation: shake 0.4s; }
.answer-display.correct-glow {
  border-color: var(--accent-green);
  box-shadow: 0 0 20px rgba(102,187,106,0.6);
  color: var(--accent-green);
}
.answer-display.wrong-glow {
  border-color: var(--accent-red);
  color: var(--accent-red);
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.feedback {
  font-size: 18px;
  font-weight: 700;
  text-align: center;
  margin-top: 8px;
  min-height: 28px;
  animation: bounce 0.5s ease;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  40% { transform: translateY(-8px); }
}
.feedback.correct { color: var(--accent-green); }
.feedback.wrong { color: var(--accent-red); }
.feedback.tryagain { color: var(--accent-gold); }

.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 8px;
  padding: 4px 2px 8px;
}
.num-btn {
  position: relative;
  background: linear-gradient(180deg, #ffffff 0%, #d8ecfb 100%);
  border: none;
  font-family: inherit;
  border-radius: 24px;
  padding: 20px 0 22px;
  font-size: 30px;
  font-weight: 800;
  color: #2a4d70;
  cursor: pointer;
  user-select: none;
  text-align: center;
  box-shadow:
    0 6px 0 #88b8d8,
    0 9px 16px rgba(76,140,200,0.25),
    inset 0 2px 0 rgba(255,255,255,0.95),
    inset 0 -3px 0 rgba(140,180,210,0.18);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
  letter-spacing: 1px;
  overflow: hidden;
}
.num-btn::before {
  content: "";
  position: absolute;
  top: 6px; left: 12px; right: 12px;
  height: 35%;
  background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0));
  border-radius: 18px 18px 50% 50%;
  pointer-events: none;
}
.num-btn:active {
  transform: translateY(5px);
  box-shadow:
    0 1px 0 #88b8d8,
    0 2px 4px rgba(76,140,200,0.2),
    inset 0 2px 0 rgba(255,255,255,0.95);
}
.num-btn.go {
  background: linear-gradient(180deg, #6ee0a8 0%, #3fbf85 100%);
  color: #fff;
  font-size: 20px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  box-shadow:
    0 6px 0 #259660,
    0 9px 16px rgba(63,191,133,0.4),
    inset 0 2px 0 rgba(255,255,255,0.4),
    inset 0 -3px 0 rgba(0,80,40,0.18);
}
.num-btn.go:active {
  box-shadow:
    0 1px 0 #259660,
    0 2px 4px rgba(63,191,133,0.25),
    inset 0 2px 0 rgba(255,255,255,0.4);
}
.num-btn.clr {
  background: linear-gradient(180deg, #ffb3a8 0%, #ff8276 100%);
  color: #fff;
  font-size: 22px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  box-shadow:
    0 6px 0 #d56860,
    0 9px 16px rgba(255,130,118,0.4),
    inset 0 2px 0 rgba(255,255,255,0.4),
    inset 0 -3px 0 rgba(120,30,20,0.2);
}
.num-btn.clr:active {
  box-shadow:
    0 1px 0 #d56860,
    0 2px 4px rgba(255,130,118,0.25),
    inset 0 2px 0 rgba(255,255,255,0.4);
}

[data-theme="dark"] .num-btn {
  background: linear-gradient(180deg, #3a5478 0%, #1f3658 100%);
  color: #e8f4ff;
  box-shadow:
    0 6px 0 #0a1a30,
    0 9px 16px rgba(0,0,0,0.5),
    inset 0 2px 0 rgba(255,255,255,0.15),
    inset 0 -3px 0 rgba(0,0,0,0.3);
}
[data-theme="dark"] .num-btn::before {
  background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0));
}
[data-theme="dark"] .num-btn:active {
  box-shadow:
    0 1px 0 #0a1a30,
    0 2px 4px rgba(0,0,0,0.4),
    inset 0 2px 0 rgba(255,255,255,0.15);
}
[data-theme="dark"] .num-btn.go {
  background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
  color: #fff;
}
[data-theme="dark"] .num-btn.clr {
  background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
  color: #fff;
}

.celebrate {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
.confetti {
  position: absolute;
  font-size: 22px;
  animation: confettiFall 2.2s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

.result-emoji {
  font-size: 70px;
  text-align: center;
  margin: 10px 0;
  animation: pop 0.7s ease;
}
@keyframes pop {
  0% { transform: scale(0) rotate(-15deg); }
  60% { transform: scale(1.25) rotate(8deg); }
  100% { transform: scale(1) rotate(0); }
}
.result-title {
  text-align: center;
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 4px;
  color: var(--text-primary);
}
.result-msg {
  text-align: center;
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
.stars-large {
  text-align: center;
  font-size: 42px;
  margin: 12px 0;
  letter-spacing: 4px;
}
.stars-large .filled { color: var(--accent-gold); animation: starPop 0.5s ease backwards; }
.stars-large .empty { color: rgba(255,196,77,0.25); }
.stars-large .filled:nth-child(1) { animation-delay: 0.2s; }
.stars-large .filled:nth-child(2) { animation-delay: 0.5s; }
.stars-large .filled:nth-child(3) { animation-delay: 0.8s; }
@keyframes starPop {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.4); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.result-stats {
  background: var(--bg-card);
  border: var(--border-card);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.result-row {
  display: flex; justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--divider);
  font-size: 15px;
}
.result-row:last-child { border-bottom: none; }
.result-label { color: var(--text-secondary); }
.result-value { font-weight: 700; color: var(--text-primary); }

.streak-banner {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-pink));
  color: white;
  font-size: 26px;
  font-weight: 900;
  padding: 18px 30px;
  border-radius: 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  z-index: 20;
  pointer-events: none;
  letter-spacing: 1px;
  text-align: center;
}
.streak-banner.show {
  animation: streakPop 1.4s ease forwards;
}
@keyframes streakPop {
  0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); }
  20% { transform: translate(-50%, -50%) scale(1.15) rotate(5deg); }
  35% { transform: translate(-50%, -50%) scale(1) rotate(0); }
  85% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(0.8) rotate(0); opacity: 0; }
}

/* 中等手机（多数安卓 / iPhone）：让游戏页一屏装得下，不用滑 */
@media (max-height: 900px) {
  .app { padding: 8px 14px 16px; }
  .top-bar { margin-bottom: 10px; }
  .game-header { margin-bottom: 8px; gap: 6px; }
  .player-mini svg { width: 32px; height: 32px; }
  .player-name { font-size: 12px; }
  .player-level { font-size: 10px; }
  .stat-pill { font-size: 12px; padding: 5px 9px; }
  .question-text { font-size: 38px; margin: 6px 0; letter-spacing: 2px; }
  .question-card { padding: 16px 14px; min-height: 0; margin-bottom: 10px; }
  .answer-display { font-size: 28px; padding: 6px; min-height: 46px; margin: 6px auto; }
  .feedback { font-size: 15px; min-height: 22px; margin-top: 4px; }
  .num-btn { padding: 12px 0 14px; font-size: 22px; border-radius: 18px; }
  .num-btn.go, .num-btn.clr { font-size: 18px; }
  .numpad { gap: 8px; margin-top: 4px; padding: 2px 2px 4px; }
  .title { font-size: 24px; margin: 4px 0 2px; }
  .subtitle { font-size: 13px; margin-bottom: 14px; }
  .section-title { font-size: 15px; margin: 12px 0 8px; }
}

/* 极小屏幕（iPhone SE 一代等）：再压一点 */
@media (max-height: 640px) {
  .question-text { font-size: 30px; }
  .question-card { padding: 12px 12px; }
  .answer-display { font-size: 24px; min-height: 38px; }
  .num-btn { padding: 9px 0 11px; font-size: 20px; }
  .numpad { gap: 6px; }
  .player-mini svg { width: 28px; height: 28px; }
}

@media (min-width: 480px) {
  .character-grid { grid-template-columns: repeat(5, 1fr); }
  .level-grid { grid-template-columns: repeat(6, 1fr); }
}

/* 防误触放大 */
button, .num-btn, .level-cell, .character-card, .mode-btn, .icon-btn, .lang-btn {
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}

/* 角色头像反应气泡 */
.avatar-wrap { position: relative; display: inline-block; }
.avatar-bubble {
  position: absolute;
  top: -8px; right: -10px;
  font-size: 22px;
  pointer-events: none;
  animation: bubblePop 1.4s ease forwards;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}
@keyframes bubblePop {
  0% { opacity: 0; transform: scale(0) translateY(0); }
  25% { opacity: 1; transform: scale(1.4) translateY(-2px); }
  50% { opacity: 1; transform: scale(1) translateY(-6px); }
  100% { opacity: 0; transform: scale(0.9) translateY(-20px); }
}

/* 闯关进度条 */
.quest-bar {
  flex: 1;
  min-width: 110px;
  height: 22px;
  background: var(--bg-card);
  border: var(--border-card);
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  box-shadow: var(--shadow);
}
.quest-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
  border-radius: 12px;
  transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 12px rgba(124,77,255,0.4);
}
.quest-bar-text {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  color: var(--text-primary);
  text-shadow: 0 0 4px rgba(255,255,255,0.6);
}
[data-theme="dark"] .quest-bar-text { text-shadow: 0 0 4px rgba(0,0,0,0.6); color: #fff; }

/* 教程气泡 */
.tutorial-bubble {
  position: fixed;
  bottom: 280px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #ffd54f, #ff80ab);
  color: white;
  padding: 12px 18px;
  border-radius: 18px;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 8px 28px rgba(0,0,0,0.25);
  z-index: 30;
  max-width: 280px;
  text-align: center;
  animation: tutBob 1.5s ease-in-out infinite;
}
.tutorial-bubble::after {
  content: '';
  position: absolute;
  bottom: -10px; left: 50%;
  margin-left: -10px;
  border: 10px solid transparent;
  border-top-color: #ff80ab;
}
@keyframes tutBob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-6px); }
}

/* 题目卡片滑入动画 */
.question-card.slide-in {
  animation: cardSlideIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.question-card.slide-out {
  animation: cardSlideOut 0.3s ease-in forwards;
}
@keyframes cardSlideIn {
  0% { opacity: 0; transform: translateX(80%) rotate(8deg) scale(0.9); }
  100% { opacity: 1; transform: translateX(0) rotate(0) scale(1); }
}
@keyframes cardSlideOut {
  0% { opacity: 1; transform: translateX(0); }
  100% { opacity: 0; transform: translateX(-80%) rotate(-6deg) scale(0.9); }
}

/* 欢迎页角色卡轻轻浮动 + 眨眼 */
.character-card svg {
  animation: charBob 3s ease-in-out infinite;
}
.character-card:nth-child(2) svg { animation-delay: 0.4s; }
.character-card:nth-child(3) svg { animation-delay: 0.8s; }
.character-card:nth-child(4) svg { animation-delay: 1.2s; }
.character-card:nth-child(5) svg { animation-delay: 1.6s; }
@keyframes charBob {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-4px) rotate(-1.5deg); }
}
.character-card.selected svg {
  animation: charDance 1.2s ease-in-out infinite;
}
@keyframes charDance {
  0%, 100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(-6px) rotate(3deg); }
  75% { transform: translateY(-3px) rotate(-3deg); }
}

/* 运算符上色 */
.op-add { color: #4caf50; font-weight: 900; }
.op-sub { color: #ef5350; font-weight: 900; }
.op-mul { color: #ab47bc; font-weight: 900; }
.op-div { color: #ff9800; font-weight: 900; }
[data-theme="dark"] .op-add { color: #6ee7a3; }
[data-theme="dark"] .op-sub { color: #ff8a82; }
[data-theme="dark"] .op-mul { color: #ce93d8; }
[data-theme="dark"] .op-div { color: #ffb74d; }

.graduation {
  text-align: center;
  padding: 20px 0;
}
.grad-crown {
  font-size: 80px;
  animation: crownFloat 2s ease-in-out infinite;
  margin: 10px 0;
}
@keyframes crownFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.05); }
}
.grad-title {
  font-size: 30px;
  font-weight: 900;
  background: linear-gradient(135deg, #ffd54f, #ff80ab, #7c4dff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.grad-msg {
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
.grad-cast {
  display: flex;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
  margin: 14px 0;
}
.grad-cast > div {
  width: 60px; height: 60px;
  animation: castWave 1.6s ease-in-out infinite;
}
.grad-cast > div:nth-child(1) { animation-delay: 0s; }
.grad-cast > div:nth-child(2) { animation-delay: 0.2s; }
.grad-cast > div:nth-child(3) { animation-delay: 0.4s; }
.grad-cast > div:nth-child(4) { animation-delay: 0.6s; }
.grad-cast > div:nth-child(5) { animation-delay: 0.8s; }
@keyframes castWave {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}

/* 结果页角色出场 */
.result-char {
  width: 110px; height: 110px;
  margin: 0 auto 10px;
  animation: resultCharIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes resultCharIn {
  0% { opacity: 0; transform: translateY(40px) scale(0.5); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* 跳过提示 */
.skip-hint {
  position: absolute;
  bottom: 8px; right: 14px;
  font-size: 11px;
  color: var(--text-light);
  opacity: 0.7;
  pointer-events: none;
  animation: skipPulse 1.5s ease-in-out infinite;
}
@keyframes skipPulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* 3星超级庆祝 */
.super-celebrate {
  position: fixed; inset: 0;

  background: radial-gradient(circle at center, rgba(255,196,77,0.35), transparent 65%);
  animation: superFlash 1.2s ease forwards;
}
@keyframes superFlash {
  0% { opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; }
}
.super-star {
  position: absolute;
  font-size: 56px;

@keyframes superStar {
  0% { transform: scale(0) rotate(0deg); opacity: 0; }
  30% { transform: scale(1.6) rotate(180deg); opacity: 1; }
  100% { transform: scale(0.8) rotate(720deg); opacity: 0; }
}

  11: { name: '+−×÷', desc: '四则混合', gen: () => mixQ(['+','-','*','/'], 5, 50) },

function ri(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function addQ(min, max) {
  const a = ri(min, max), b = ri(min, max);
  return { text: `${a} + ${b}`, answer: a + b };
}
function mixQ(ops, min, max) {
  const op = ops[ri(0, ops.length - 1)];
  let a, b, ans, text;
  if (op === '+') { a = ri(min, max); b = ri(min, max); ans = a + b; text = `${a} + ${b}`; }
  else if (op === '-') { a = ri(min, max); b = ri(min, a); ans = a - b; text = `${a} − ${b}`; }
  else if (op === '*') { a = ri(2, 9); b = ri(2, 9); ans = a * b; text = `${a} × ${b}`; }
  else { b = ri(2, 9); ans = ri(2, 9); a = b * ans; text = `${a} ÷ ${b}`; }
  return { text, answer: ans };
}
function mulQ(min, max) {
  const a = ri(min, max), b = ri(1, 9);
  return { text: `${a} × ${b}`, answer: a * b };
}
function divQ(min, max) {
  const b = ri(min, max), ans = ri(2, 9);
  return { text: `${b * ans} ÷ ${b}`, answer: ans };
}
function twoStepQ() {
  const a = ri(2, 9), b = ri(2, 9);
  const first = a * b;
  if (Math.random() < 0.5) {
    const c = ri(2, 25);
    return { text: `${a} × ${b} + ${c}`, answer: first + c };
  } else {
    const c = ri(2, Math.max(3, first - 2));
    return { text: `${a} × ${b} − ${c}`, answer: first - c };
  }
}

// ---------- 音效（Web Audio API，无需音频文件）----------
function ensureAudio() {
  if (!state.audioCtx) {
    try { state.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) {}
  }
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume();
  }
}
function tone(freq, dur, type='sine', vol=0.25, delay=0) {
  if (!state.audioCtx) return;
  if (state.soundMode === 'mute') return;
  try {
    const t0 = state.audioCtx.currentTime + delay;
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain); gain.connect(state.audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur);
  } catch(e) {}
}

// 朗读题目（浏览器内建语音）
function speakQuestion(q) {
  if (state.soundMode !== 'all' || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    if (state.speakTimer) { clearTimeout(state.speakTimer); state.speakTimer = null; }
    const map = state.language === 'zh'
      ? { '+': ' 加 ', '−': ' 减 ', '-': ' 减 ', '×': ' 乘 ', '÷': ' 除以 ' }
      : { '+': ' plus ', '−': ' minus ', '-': ' minus ', '×': ' times ', '÷': ' divided by ' };
    let text = q.text;
    for (const k in map) text = text.split(k).join(map[k]);
    text += state.language === 'zh' ? ' 等于多少' : ' equals what';
    const u = new SpeechSynthesisUtterance(text);
    u.lang = state.language === 'zh' ? 'zh-CN' : 'en-US';
    u.rate = 0.9;
    u.pitch = 1.15;
    u.volume = 0.9;
    state.speakTimer = setTimeout(() => {
      state.speakTimer = null;
      try { speechSynthesis.speak(u); } catch(e) {}
    }, 200);
  } catch(e) {}
}

    cell.style.position = 'relative';
    cell.innerHTML = `
      <div class="level-num">${i}</div>
      <div class="level-stars">${starHtml}</div>
      ${unlocked ? '' : '<div class="level-lock">🔒</div>'}
      ${mBadge}
    `;
    if (unlocked) {
      cell.addEventListener('click', () => {
        ensureAudio(); sfx.click();
        state.currentLevel = i;
        startGame();
      });
    }
    grid.appendChild(cell);
  }
}

// ---------- 游戏开始 ----------
function startGame() {
  state.score = 0;
  state.questionsAnswered = 0;
  state.correctCount = 0;
  state.wrongCount = 0;
  state.lives = 3;
  state.timeLeft = 60;
  state.consecutive = 0;
  state.bestStreak = 0;
  state.multiplier = 1;
  state.attempts = 0;
  state.inputBuffer = '';
  state.startTime = Date.now();
  state.isLocked = false;
  state.recentQuestions = []; // 每局重置避免上局题目"堵塞"新一局
  if (state.timerInterval) clearInterval(state.timerInterval);

  // 顶部玩家头像
  const avatar = document.getElementById('gamePlayerAvatar');
  avatar.innerHTML = CHARACTERS[state.selectedCharacter].svg;
  document.getElementById('gamePlayerName').textContent = t(CHARACTERS[state.selectedCharacter].nameKey);
  document.getElementById('gameLevelLabel').textContent = t('levelLabel', { n: state.currentLevel });

  renderNumpad();
  showScreen('screen-game');
  state.lastMode = state.currentMode;
  state.lastLevel = state.currentLevel;
  save();
  maybeShowTutorial();
  nextQuestion();

  if (state.currentMode === 'timed') {
    state.timerInterval = setInterval(() => {
      state.timeLeft--;
      updateStats();
      if (state.timeLeft <= 0) {
        clearInterval(state.timerInterval);
        endGame('timeUp');
      }
    }, 1000);
  }
  updateStats();
}

// ---------- 顶部状态条 ----------
function updateStats() {
  const box = document.getElementById('gameStats');
  let html = '';
  if (state.currentMode === 'practice') {
    html += `<div class="stat-pill">✓ ${state.correctCount}</div>`;
  } else if (state.currentMode === 'timed') {
    const cls = state.timeLeft <= 10 ? 'stat-pill warn' : 'stat-pill';
    html += `<div class="${cls}">⏱ ${state.timeLeft}${t('seconds')}</div>`;
    html += `<div class="stat-pill">✓ ${state.correctCount}</div>`;
  } else if (state.currentMode === 'quest') {
    const pct = Math.min(100, state.correctCount * 10);
    html += `<div class="stat-pill">${'❤️'.repeat(state.lives)}${'🤍'.repeat(3 - state.lives)}</div>`;
    html += `<div class="quest-bar"><div class="quest-bar-fill" style="width:${pct}%"></div><div class="quest-bar-text">${state.correctCount} / 10</div></div>`;
  } else if (state.currentMode === 'challenge') {
    html += `<div class="stat-pill">🔥 ${state.consecutive}</div>`;
    html += `<div class="stat-pill">⭐ ${state.score}</div>`;
  }
  box.innerHTML = html;
}

// ---------- 出题 ----------
function nextQuestion() {
  state.attempts = 0;
  state.inputBuffer = '';
  state.isLocked = false;
  let q = null;
  // 30% 概率从本关错题本抽一道复习（如果有的话）
  const lvlMistakes = state.mistakes[state.currentLevel] || [];
  if (lvlMistakes.length > 0 && Math.random() < 0.3) {
    const m = lvlMistakes[ri(0, lvlMistakes.length - 1)];
    q = { text: m.text, answer: m.answer, isReview: true };
  } else {
    let tries = 0;
    do {
      q = LEVEL_CONFIGS[state.currentLevel].gen();
      tries++;
    } while (tries < 12 && state.recentQuestions.includes(q.text));
  }
  state.recentQuestions.push(q.text);
  // 防重复窗口扩大到 15，避免一局内反复出现同一题
  if (state.recentQuestions.length > 15) state.recentQuestions.shift();
  state.currentQuestion = q;
  // 给运算符上色
  const colored = q.text
    .replace(/\+/g, '<span class="op-add">+</span>')
    .replace(/−/g, '<span class="op-sub">−</span>')
    .replace(/×/g, '<span class="op-mul">×</span>')
    .replace(/÷/g, '<span class="op-div">÷</span>');
  const reviewTag = q.isReview
    ? `<div style="font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff80ab,#7c4dff);display:inline-block;padding:3px 10px;border-radius:10px;margin-bottom:8px;letter-spacing:1px;">📒 ${state.language === 'zh' ? '复习题' : 'Review'}</div><br>`
    : '';
  document.getElementById('questionText').innerHTML = `${reviewTag}${colored} <span class="eq">=</span> ?`;
  // 卡片滑入动画
  const card = document.querySelector('.question-card');
  card.classList.remove('slide-in');
  void card.offsetWidth;
  card.classList.add('slide-in');
  speakQuestion(q);
  const ad = document.getElementById('answerDisplay');
  ad.textContent = ' ';
  ad.className = 'answer-display';
  document.getElementById('feedback').textContent = ' ';
  document.getElementById('feedback').className = 'feedback';
}

// ---------- 数字键盘 ----------
function renderNumpad() {
  const pad = document.getElementById('numpad');
  pad.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','clr','0','go'];
  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.type = 'button'; // 防止误触发表单提交，外接键盘可 Tab 聚焦
    btn.className = 'num-btn';
    if (k === 'clr') { btn.classList.add('clr'); btn.textContent = '⌫'; btn.setAttribute('aria-label', '删除'); }
    else if (k === 'go') { btn.classList.add('go'); btn.textContent = 'OK'; btn.setAttribute('aria-label', '提交'); }
    else btn.textContent = k;
    btn.addEventListener('click', () => onKey(k));
    pad.appendChild(btn);
  });
}

function onKey(k) {
  if (state.isLocked) return;
  ensureAudio();
  sfx.click();
  const ad = document.getElementById('answerDisplay');
  if (k === 'clr') {
    state.inputBuffer = state.inputBuffer.slice(0, -1);
  } else if (k === 'go') {
    if (state.inputBuffer === '') return;
    submitAnswer();
    return;
  } else {
    if (state.inputBuffer.length < 4) state.inputBuffer += k;
  }
  ad.textContent = state.inputBuffer || ' ';
}

// ---------- 提交答案 ----------
function submitAnswer() {
  const userAns = parseInt(state.inputBuffer, 10);
  const correctAns = state.currentQuestion.answer;
  const ad = document.getElementById('answerDisplay');
  const fb = document.getElementById('feedback');

  if (userAns === correctAns) {
    // 答对了
    state.isLocked = true;
    sfx.correct();
    // 如果是错题复习，做对就把这题从错题本移除
    if (state.currentQuestion.isReview) {
      const arr = state.mistakes[state.currentLevel] || [];
      const idx = arr.findIndex(m => m.text === state.currentQuestion.text);
      if (idx >= 0) {
        arr.splice(idx, 1);
        if (arr.length === 0) delete state.mistakes[state.currentLevel];
        save();
      }
    }
    ad.classList.add('correct-glow');
    fb.textContent = '✨ ' + t('correct') + ' ✨';
    fb.className = 'feedback correct';
    avatarReact('correct');
    state.correctCount++;
    state.questionsAnswered++;
    state.consecutive++;
    if (state.consecutive > state.bestStreak) state.bestStreak = state.consecutive;
    // 挑战模式分数计算
    if (state.currentMode === 'challenge') {
      const mult = Math.min(10, 1 + Math.floor(state.consecutive / 3));
      state.multiplier = mult;
      state.score += 10 * mult;
      if (state.consecutive > 0 && state.consecutive % 5 === 0) {
        showStreakBanner(`🔥 ${state.consecutive} ${t('streak')}!  x${mult}`);
        sfx.streak();
      }
    } else {
      state.score += 10;
    }
    sparkle();
    updateStats();
    showSkipHint();
    state.pendingTimer = setTimeout(() => { state.pendingTimer = null; checkProgress(); }, 800);
  } else {
    // 答错了
    state.attempts++;
    ad.classList.add('shake');
    setTimeout(() => ad.classList.remove('shake'), 400);

    if (state.attempts === 1) {
      // 第一次错：再试一次
      sfx.tryAgain();
      fb.textContent = '💪 ' + t('tryAgain');
      fb.className = 'feedback tryagain';
      avatarReact('tryagain');
      state.inputBuffer = '';
      ad.textContent = ' ';
    } else {
      // 第二次错：显示正确答案
      state.isLocked = true;
      sfx.wrong();
      ad.classList.add('wrong-glow');
      ad.textContent = correctAns;
      fb.textContent = '📘 ' + t('wrong') + ' ' + correctAns;
      fb.className = 'feedback wrong';
      avatarReact('wrong');
      state.questionsAnswered++;
      state.wrongCount++;
      state.consecutive = 0;
      state.multiplier = 1;
      if (state.currentMode === 'quest') {
        state.lives--;
      }
      // 加入本关错题本（同题不重复，每关最多 20 道）
      const mArr = state.mistakes[state.currentLevel] || (state.mistakes[state.currentLevel] = []);
      if (!mArr.some(m => m.text === state.currentQuestion.text)) {
        mArr.push({ text: state.currentQuestion.text, answer: correctAns });
        if (mArr.length > 20) mArr.shift();
        save();
      }
      updateStats();
      showSkipHint();
      state.pendingTimer = setTimeout(() => { state.pendingTimer = null; checkProgress(); }, 1800);
    }
  }
}

// ---------- 检查游戏进度 ----------
function checkProgress() {
  if (state.currentMode === 'quest') {
    if (state.lives <= 0) { endGame('gameOver'); return; }
    if (state.correctCount >= 10) { endGame('levelComplete'); return; }
    nextQuestion();
  } else if (state.currentMode === 'practice') {
    if (state.questionsAnswered >= 10) { endGame('practiceDone'); return; }
    nextQuestion();
  } else if (state.currentMode === 'timed') {
    nextQuestion(); // 直到时间到
  } else if (state.currentMode === 'challenge') {
    if (state.questionsAnswered >= 15) { endGame('practiceDone'); return; }
    nextQuestion();
  }
}

// ---------- 结束游戏 ----------
function endGame(reason) {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }

  // 计算星星
  let stars = 0;
  const accuracy = state.questionsAnswered > 0 ? state.correctCount / state.questionsAnswered : 0;
  if (state.currentMode === 'practice') {
    if (accuracy >= 1) stars = 3;
    else if (accuracy >= 0.7) stars = 2;
    else if (accuracy >= 0.4) stars = 1;
  } else if (state.currentMode === 'timed') {
    if (state.correctCount >= 15) stars = 3;
    else if (state.correctCount >= 10) stars = 2;
    else if (state.correctCount >= 5) stars = 1;
  } else if (state.currentMode === 'quest') {
    if (reason === 'levelComplete') {
      if (state.lives === 3) stars = 3;
      else if (state.lives === 2) stars = 2;
      else stars = 1;
    }
  } else if (state.currentMode === 'challenge') {
    if (state.bestStreak >= 10) stars = 3;
    else if (state.bestStreak >= 5) stars = 2;
    else if (state.bestStreak >= 3) stars = 1;
  }

  // 解锁与存星
  const passed = (state.currentMode === 'quest') ? (reason === 'levelComplete') : (stars >= 1);
  let unlockedNew = false;
  if (passed) {
    if (state.currentLevel < 12 && !state.unlockedLevels.includes(state.currentLevel + 1)) {
      state.unlockedLevels.push(state.currentLevel + 1);
      unlockedNew = true;
    }
    const prev = state.levelStars[state.currentLevel] || 0;
    if (stars > prev) state.levelStars[state.currentLevel] = stars;
  }
  save();

  // 渲染结果页
  let emoji = '🎉', titleKey = 'levelComplete';
  if (reason === 'gameOver') { emoji = '💪'; titleKey = 'gameOver'; sfx.fail(); }
  else if (reason === 'timeUp') { emoji = '⏰'; titleKey = 'timeUp'; sfx.fail(); }
  else if (reason === 'practiceDone') { emoji = '🌟'; titleKey = 'practiceDone'; sfx.levelUp(); }
  else { sfx.levelUp(); confettiBurst(); }
  if (stars >= 3) { superCelebrate(); setTimeout(() => sfx.streak(), 400); }
  if (passed && state.currentLevel === 12) {
    superCelebrate();
    setTimeout(() => confettiBurst(), 600);
    setTimeout(() => confettiBurst(), 1400);
    setTimeout(() => sfx.levelUp(), 800);
  }

  // 毕业典礼角色阵容（一次性填充）
  const isGraduation = (state.currentLevel === 12) && passed;
  if (isGraduation) {
    const cast = document.getElementById('gradCast');
    cast.innerHTML = '';
    for (const k in CHARACTERS) {
      const d = document.createElement('div');
      d.innerHTML = CHARACTERS[k].svg;
      cast.appendChild(d);
    }
  }

  // 鼓励语
  let msgKey = 'msgKeep';
  if (stars >= 3) msgKey = 'perfectMsg';
  else if (stars >= 2) msgKey = 'msgWow';
  else if (stars >= 1) msgKey = 'msgGreat';

  // 决定要显示哪些数据行
  const elapsed = Math.round((Date.now() - state.startTime) / 1000);
  let rowKeys = [];
  if (state.currentMode === 'challenge') {
    rowKeys.push(['yourScore', state.score]);
    rowKeys.push(['bestStreak', state.bestStreak + ' 🔥']);
  } else if (state.currentMode === 'timed') {
    rowKeys.push(['correctAnswers', state.correctCount]);
    rowKeys.push(['totalAnswers', state.questionsAnswered]);
  } else {
    rowKeys.push(['correctCount', `${state.correctCount}/${state.questionsAnswered}`]);
  }
  if (state.questionsAnswered > 0) rowKeys.push(['accuracy', Math.round(accuracy * 100) + '%']);
  rowKeys.push(['timeUsed', elapsed]);

  state.lastResultContext = {
    emoji, titleKey, msgKey, unlockedNew, isGraduation, stars, rowKeys,
    canNext: passed && state.currentLevel < 12,
  };
  renderResultContent();
  showScreen('screen-result');
}

// 根据 lastResultContext 渲染结果页（语言切换时也用）
function renderResultContent() {
  const ctx = state.lastResultContext;
  if (!ctx) return;
  // 毕业典礼
  const grad = document.getElementById('graduation');
  if (ctx.isGraduation) {
    grad.style.display = 'block';
    document.getElementById('gradTitle').textContent = t('gradTitle');
    document.getElementById('gradMsg').textContent = t('gradMsg');
    document.getElementById('resultChar').style.display = 'none';
  } else {
    grad.style.display = 'none';
    const charBox = document.getElementById('resultChar');
    if (state.selectedCharacter && CHARACTERS[state.selectedCharacter]) {
      charBox.innerHTML = CHARACTERS[state.selectedCharacter].svg;
      charBox.style.display = 'block';
    }
  }
  document.getElementById('resultEmoji').textContent = ctx.emoji;
  document.getElementById('resultTitle').textContent = t(ctx.titleKey);
  document.getElementById('resultMsg').textContent = t(ctx.msgKey) + (ctx.unlockedNew ? '  🔓 ' + t('levelUnlocked') : '');

  // 星星
  let starsHtml = '';
  for (let i = 0; i < 3; i++) {
    starsHtml += i < ctx.stars ? '<span class="filled">★</span>' : '<span class="empty">★</span>';
  }
  document.getElementById('resultStars').innerHTML = starsHtml;

  // 数据行
  const html = ctx.rowKeys.map(([labelKey, value]) => {
    const label = t(labelKey);
    const val = labelKey === 'timeUsed' ? value + t('seconds') : value;
    return `<div class="result-row"><span class="result-label">${label}</span><span class="result-value">${val}</span></div>`;
  }).join('');
  document.getElementById('resultStats').innerHTML = html;

  // 下一关按钮
  document.getElementById('resultNext').style.display = ctx.canNext ? 'block' : 'none';
}

// ---------- 视觉特效：闪光 ----------
function sparkle() {
  const card = document.querySelector('.question-card');
  const r = card.getBoundingClientRect();
  const emojis = ['❄️','✨','⭐','💎'];
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle-burst';
    s.textContent = emojis[ri(0, emojis.length - 1)];
    s.style.position = 'fixed';
    s.style.left = (r.left + r.width / 2) + 'px';
    s.style.top = (r.top + r.height / 2) + 'px';
    s.style.fontSize = '22px';
    s.style.pointerEvents = 'none';
    s.style.zIndex = '15';
    s.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
    s.style.setProperty('--ty', (Math.random() - 0.5) * 200 - 50 + 'px');
    s.style.animation = 'sparkle 0.9s ease-out forwards';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

// 添加 sparkle 动画

styleEl.textContent = `@keyframes sparkle { 0% {opacity:1;transform:translate(0,0) scale(0.4);} 100% {opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.5);} }`;

// ---------- 多语言 / 主题 ----------

  });

// 切换语言时刷新游戏内动态文字
function refreshDynamicStrings() {
  // 游戏头部：玩家名 + 等级标签
  if (state.selectedCharacter && CHARACTERS[state.selectedCharacter]) {
    const nameEl = document.getElementById('gamePlayerName');
    if (nameEl) nameEl.textContent = t(CHARACTERS[state.selectedCharacter].nameKey);
  }
  const lvlEl = document.getElementById('gameLevelLabel');
  if (lvlEl && state.currentLevel) lvlEl.textContent = t('levelLabel', { n: state.currentLevel });

  // 游戏内统计条（如游戏中）
  const gameScreen = document.getElementById('screen-game');
  if (gameScreen && gameScreen.classList.contains('active')) updateStats();

  // 结果页（包含毕业典礼）
  const resultScreen = document.getElementById('screen-result');
  if (resultScreen && resultScreen.classList.contains('active') && state.lastResultContext) {
    renderResultContent();
  }

  // 跳过提示（如显示）
  const skipEl = document.querySelector('.skip-hint');
  if (skipEl) skipEl.textContent = state.language === 'zh' ? '👆 点击跳过' : '👆 Tap to skip';

  // 反馈文字（如显示）
  const fb = document.getElementById('feedback');
  if (fb && state.currentQuestion && fb.classList.length > 1) {
    if (fb.classList.contains('correct')) fb.textContent = '✨ ' + t('correct') + ' ✨';
    else if (fb.classList.contains('tryagain')) fb.textContent = '💪 ' + t('tryAgain');
    else if (fb.classList.contains('wrong')) fb.textContent = '📘 ' + t('wrong') + ' ' + state.currentQuestion.answer;
  }
}
function applyTheme() {
  document.body.dataset.theme = state.theme;
  document.getElementById('themeBtn').textContent = state.theme === 'light' ? '🌙' : '☀️';
}
function applySound() {
  const icon = state.soundMode === 'all' ? '🔊' : state.soundMode === 'sfx' ? '🔉' : '🔇';
  document.getElementById('speechBtn').textContent = icon;
}

// 教程气泡（首次进入游戏画面时显示）
function maybeShowTutorial() {
  if (state.seenTutorial) return;
  setTimeout(() => {
    const b = document.createElement('div');
    b.className = 'tutorial-bubble';
    b.textContent = t('tutorialTip');
    document.body.appendChild(b);
    setTimeout(() => {
      b.style.animation = 'fadeOut 0.4s forwards';
      setTimeout(() => b.remove(), 400);
    }, 4500);
    state.seenTutorial = true;
    save();
  }, 600);
}

// ---------- 事件绑定 ----------
document.getElementById('langBtn').addEventListener('click', () => {
  ensureAudio(); sfx.click();
  state.language = state.language === 'zh' ? 'en' : 'zh';
  save();
  applyLanguage();
});
document.getElementById('themeBtn').addEventListener('click', () => {
  ensureAudio(); sfx.click();
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  save();
  applyTheme();
});
document.getElementById('speechBtn').addEventListener('click', () => {
  ensureAudio();
  // 3 档循环: all → sfx → mute → all
  state.soundMode = state.soundMode === 'all' ? 'sfx' : state.soundMode === 'sfx' ? 'mute' : 'all';
  if (state.soundMode !== 'all' && window.speechSynthesis) speechSynthesis.cancel();
  save();
  applySound();
  if (state.soundMode !== 'mute') sfx.click();
});
document.getElementById('backBtn').addEventListener('click', () => {
  ensureAudio(); sfx.click();
  const active = document.querySelector('.screen.active').id;
  // 游戏中途返回前先确认，避免误触丢失进度
  if (active === 'screen-game' && !state.isLocked && state.questionsAnswered > 0) {
    const msg = state.language === 'zh' ? '确定要离开本局吗？当前进度会丢失。' : 'Leave this round? Progress will be lost.';
    if (!confirm(msg)) return;
  }
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  if (state.pendingTimer) { clearTimeout(state.pendingTimer); state.pendingTimer = null; }
  if (state.speakTimer) { clearTimeout(state.speakTimer); state.speakTimer = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (active === 'screen-mode') showScreen('screen-welcome');
  else if (active === 'screen-level') showScreen('screen-mode');
  else if (active === 'screen-game' || active === 'screen-result') {
    renderLevels(); // 刷新错题本徽标
    showScreen('screen-level');
  }
});
document.getElementById('welcomeNext').addEventListener('click', () => {
  ensureAudio(); sfx.click();
  showScreen('screen-mode');
});
document.getElementById('resultHome').addEventListener('click', () => {
  ensureAudio(); sfx.click();
  showScreen('screen-welcome');
});
document.getElementById('resultAgain').addEventListener('click', () => {
  ensureAudio(); sfx.click();
  startGame();
});
document.getElementById('resultNext').addEventListener('click', () => {
  ensureAudio(); sfx.click();
  if (state.unlockedLevels.includes(state.currentLevel + 1)) {
    state.currentLevel++;
    startGame();
  }
});

// 点题目卡片可以跳过等待
document.querySelector('.question-card').addEventListener('click', () => {
  if (state.pendingTimer) { ensureAudio(); sfx.click(); skipPending(); }
});

// 键盘支持（电脑测试用）
document.addEventListener('keydown', (e) => {
  const active = document.querySelector('.screen.active').id;
  if (active !== 'screen-game') return;
  if (state.pendingTimer && (e.key === 'Enter' || e.key === ' ')) { skipPending(); return; }
  if (e.key >= '0' && e.key <= '9') onKey(e.key);
  else if (e.key === 'Enter') onKey('go');
  else if (e.key === 'Backspace') onKey('clr');
});

// ---------- 启动 ----------
load();
applyTheme();
applySound();
applyLanguage();
makeSnowflakes();
makeStars();
renderWelcome();
renderModes();
// 如果上次玩过，初始就定位到上次的等级
if (state.lastLevel && state.lastLevel >= 1 && state.lastLevel <= 12) {
  state.currentLevel = state.lastLevel;
}
if (state.lastMode) state.currentMode = state.lastMode;

// 添加 fadeOut 动画（教程气泡用）
const fadeStyle = document.createElement('style');
fadeStyle.textContent = '@keyframes fadeOut { to { opacity: 0; transform: translateX(-50%) translateY(20px); } }';
document.head.appendChild(fadeStyle);
</script>

</body>
</html>
